name: FluidMusic
options:
  bundleIdPrefix: com.randy.fluidmusic
  deploymentTarget:
    iOS: '26.1'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: '26.1'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: group.com.randy.fluidmusic.ios
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FluidMusic:
    type: application
    platform: iOS
    sources:
      - path: FluidMusic
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randy.fluidmusic.ios
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) FLUID_MUSIC_APP'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 流体音乐
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        FluidMusicAppGroup: $(APP_GROUP_ID)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.randy.fluidmusic.ios
            CFBundleURLSchemes: [fluidmusic]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio and Lyrics
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, org.xiph.flac, com.randy.fluidmusic.lrc]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.randy.fluidmusic.lrc
            UTTypeDescription: LRC Lyrics
            UTTypeConformsTo: [public.text, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [lrc]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: ['$(APP_GROUP_ID)']
    dependencies:
      - target: FluidMusicWidget
        embed: true
  FluidMusicWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FluidMusicWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randy.fluidmusic.ios.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 流体音乐
        FluidMusicAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: ['$(APP_GROUP_ID)']
  FluidMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FluidMusic
  FluidMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FluidMusic
    dependencies:
      - target: FluidMusic
schemes:
  FluidMusic:
    build:
      targets:
        FluidMusic: all
    test:
      gatherCoverageData: true
      targets:
        - name: FluidMusicTests
        - name: FluidMusicUITests
    run:
      config: Debug
    archive:
      config: Release
